<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="#0E0E10"/>
  <text x="48" y="72" fill="#E8E8EA" font-size="40" font-family="DejaVu Sans, Noto Sans, sans-serif" font-weight="700">Dont Xpose Me</text>
  <rect x="40" y="148" width="1000" height="140" rx="24" fill="#1B3A1F"/>
  <text x="80" y="210" fill="#C8E6C9" font-size="40" font-family="DejaVu Sans, Noto Sans, sans-serif" font-weight="700">TEST MODE</text>
  <text x="80" y="256" fill="#C8E6C9" font-size="26" font-family="DejaVu Sans, Noto Sans, sans-serif">Matches are logged — wipe is off</text>
  <rect width="1080" height="1920" fill="#000000" fill-opacity="0.55"/>
  <rect x="80" y="560" width="920" height="700" rx="28" fill="#18181C"/>
  <text x="120" y="650" fill="#E8E8EA" font-size="36" font-family="DejaVu Sans, Noto Sans, sans-serif" font-weight="700">Arm irreversible wipe?</text>
  <text x="120" y="730" fill="#B0B0B8" font-size="28" font-family="DejaVu Sans, Noto Sans, sans-serif">The next matching duress PIN will</text>
  <text x="120" y="774" fill="#B0B0B8" font-size="28" font-family="DejaVu Sans, Noto Sans, sans-serif">destroy encryption keys, request a</text>
  <text x="120" y="818" fill="#B0B0B8" font-size="28" font-family="DejaVu Sans, Noto Sans, sans-serif">userdata wipe, and shut down.</text>
  <text x="120" y="862" fill="#B0B0B8" font-size="28" font-family="DejaVu Sans, Noto Sans, sans-serif">There is no recovery.</text>
  <text x="120" y="940" fill="#E53935" font-size="26" font-family="DejaVu Sans, Noto Sans, sans-serif">No test matches yet. Enter the</text>
  <text x="120" y="980" fill="#E53935" font-size="26" font-family="DejaVu Sans, Noto Sans, sans-serif">duress PIN at the lock screen first.</text>
  <text x="760" y="1160" fill="#90CAF9" font-size="28" font-family="DejaVu Sans, Noto Sans, sans-serif" font-weight="700">Cancel</text>
  <text x="940" y="1160" fill="#E53935" font-size="28" font-family="DejaVu Sans, Noto Sans, sans-serif" font-weight="700">Arm</text>
</svg>
